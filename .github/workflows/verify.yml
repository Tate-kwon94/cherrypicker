name: verify

on:
  push:
    branches: ["**"]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 진행 중인 실행을 접는다.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# GitHub가 유일한 개발 기준 저장소다. Workflow 자체에는 읽기 권한만 준다.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # package.json 의 engines 를 단일 출처로 삼는다.
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # lint → typecheck → 생성 타입 최신성 → 설정 drift → 빌드·테스트 → 빌드 후 drift.
      # `npm test` 가 빌드를 포함하므로 빌드를 따로 돌리지 않는다.
      - run: npm run verify

      - name: production dependency audit
        # 배포 Worker 에 실리는 의존성만 본다. dev 툴체인 취약점은
        # 별도로 추적하며 이 게이트를 막지 않는다.
        run: npm audit --omit=dev --audit-level=high

  # GitHub main 이 개발·릴리스의 유일한 기준이다. Sites 배포 자격증명은
  # 단기 토큰이므로 Actions 시크릿에 저장하지 않는다. 배포 시 검증을 통과한
  # main 의 정확한 SHA를 Sites에 전달해 같은 소스로 버전을 만든다.
