name: verify

on:
  push:
    branches: ["**"]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 진행 중인 실행을 접는다.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# GitHub가 유일한 개발 기준 저장소다. Workflow 자체에는 읽기 권한만 준다.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json 의 engines 를 단일 출처로 삼는다.
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # lint → typecheck → 생성 타입 최신성 → 설정 drift → 빌드·테스트 → 빌드 후 drift.
      # `npm test` 가 빌드를 포함하므로 빌드를 따로 돌리지 않는다.
      - run: npm run verify

      - name: production dependency audit
        # 배포 Worker 에 실리는 의존성만 본다. dev 툴체인 취약점은
        # 별도로 추적하며 이 게이트를 막지 않는다.
        run: npm audit --omit=dev --audit-level=high

  # PR·기능 브랜치는 검증만 한다. 검증을 거쳐 main 에 병합된 커밋만
  # Sites 배포 저장소로 전달하므로 GitHub main 이 유일한 배포 기준이다.
  deploy-mirror:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: push verified main to Sites deploy remote
        env:
          TOKEN: ${{ secrets.OPENAI_GIT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::OPENAI_GIT_TOKEN secret 이 없어 검증된 main 을 배포 원격에 전달하지 못했습니다."
            exit 1
          fi
          git -c "http.extraHeader=Authorization: Bearer ${TOKEN}" push \
            "https://git.chatgpt-team.site/d5f6ca74-3c70-4114-9c48-6c2443d7b023/appgprj_6a6aea70ea048191a5af04fe8cbf02da.git" \
            HEAD:main
